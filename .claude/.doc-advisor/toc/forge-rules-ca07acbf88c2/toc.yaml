  plugins/forge/docs/error_classification_spec.md:
    title: Error Definition, Classification, and Cause Specification
    purpose: Defines what an error is, classifies errors as recoverable or fatal, separates causes (bug, fault, user input or environment) from events, and sets criteria for adding new error values.
    content_details:
      - "Error definition: an event where processing cannot proceed as intended, regardless of whether it was anticipated"
      - "Judgeable outcomes: a failure-looking check whose result decides a finding is not an error; judge first before treating it as an error"
      - Recoverable vs fatal classification by whether a recovery means exists; classification shifts to fatal when means are exhausted
      - "Recovery means beyond retry: alternate path, waiting, or asking the user; retry is not always the right means"
      - "Cause table: bug (developer), fault (environment administrator), user input or environment (user)"
      - Bugs must not trigger runtime recovery; bug-caused errors are reported and stopped
      - "No dedicated error values or recovery paths per cause; add a value only if the receiver's behavior changes"
      - "Severity catalog: silent swallowing is critical; bug recovery, judgeable events raised as errors, unneeded values, and dedicated fault values are major or minor"
    applicable_tasks:
      - Error handling design for scripts, agents, and requirement error-case sections
      - Review of error classification and of proposed new error values
      - Deciding whether a condition should be an error or a judgement result
      - Choosing recoverable versus fatal handling for a failure
      - Triaging error causes into bug, fault, or user input or environment
    keywords:
