  plugins/forge/docs/adr_principles_spec.md:
    title: ADR Operating Principles
    purpose: "Defines principles for creating and revising ADRs: what to record and exclude, review criteria, reference rules, mutable-document handling, and file placement with ID numbering."
    content_details:
      - ADR scope limited to decisions whose rationale would be lost if unrecorded, excluding rules, specification bodies, implementation notes and one-off incidents
      - "Recording requires two conditions together: a better alternative is foreseeable, and the proposal being wrong is not evident from code, rules or specs"
      - Exception for recording user-approved designs that deviate from requirements, including the approval fact and its reason
      - ADR must not copy specification or rule bodies; it references them with markdown links including section numbers
      - Optional scope field, written only when parallel requirements or designs exist for the same target and the decided extent is unclear
      - Review criteria table for rejecting, revising or flagging insufficient ADR drafts, with approval records never rejected
      - "ADR is a mutable document: a reversed decision section is rewritten in place, section numbers are kept, and no change log or status history section is created"
      - Decision reversal moves the old option into rejected alternatives with its reason, without creating a separate ADR or a deprecated mark
      - "Placement: one ADR file per feature named ADR-NNN_feature.md, with the number assigned once via next-spec-id using the shared ADR,DES prefix"
      - Severity catalog for ADR violations, where changing or deleting section numbers is critical
    applicable_tasks:
      - Creating a new ADR for a design decision
      - Revising or reversing an existing ADR decision section
      - Reviewing whether a decision qualifies for ADR recording
      - Deciding ADR file placement and ID numbering for a feature
      - Writing rejected alternatives and rationale in an ADR
      - Reviewing ADR documents against severity criteria
    keywords:
      - ADR
