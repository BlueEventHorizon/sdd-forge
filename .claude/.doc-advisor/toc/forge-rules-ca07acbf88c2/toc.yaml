  plugins/forge/docs/design_principles_spec.md:
    title: Design Document Creation Principles
    purpose: Generic design document principles used when project rules are absent. Covers the How scope, prohibited content, quantitative goal handling, implementability criterion, dependency and cohesion norms, and a severity catalog.
    content_details:
      - Design document scope as How, with What belonging to the requirements document and the boundary judged by spec_design_boundary_spec
      - "Prohibited content: source code beyond 5-10 lines, unstated technology choices, features absent from requirements, guaranteed quantitative outcomes"
      - "Quantitative goals: strategies such as cache, debounce, async, redundancy are allowed, but achievement is never guaranteed and undetermined values are not invented"
      - "Implementability criterion: a design is sufficient when an implementer can build it, e.g. SearchService.search() versus a vague search process"
      - Hierarchical splitting when a single file exceeds 500 lines, with the parent design ID referenced in each child overview
      - "Mermaid guidance: flowchart TB, classDiagram, sequenceDiagram, and uppercase End required in flowchart"
      - "Architecture dependency rules: lower layers must not depend on upper layers, Domain must not reference Infrastructure in clean architecture, no circular dependencies"
      - Responsibility split and cohesion rules, YAGNI for single-use generic structures, and asset placement under the owning component
      - "Availability norms: SPOF redundancy or alternative path, external API retry timeout fallback, and abnormal data flow documented"
      - Severity catalog mapping prohibited patterns and deliverable violations to critical, major, or minor
    applicable_tasks:
      - Creation of a design document when no project-specific design rule exists
      - Review of a design document against general design principles
      - Judging whether a design item belongs in the design document or the requirements document
      - Review of architecture dependency direction and responsibility cohesion in a design
