    purpose: Defines plan document structure, task ID and priority, task granularity, required_reading, task groups, dependency management, acceptance criteria, test rules, and requirement traceability for plan JSON files.
    content_details:
      - "Plan limited to three top-level keys: requirements_traceability, design_traceability, and tasks"
      - design_traceability requirement_ids is mandatory, since requirement status updates follow design to requirement_ids to task_ids
      - requirements_traceability holds no task_ids; requirement to task mapping is derived through design_traceability
