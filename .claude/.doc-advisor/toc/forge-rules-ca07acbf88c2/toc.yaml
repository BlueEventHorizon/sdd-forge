      - Severity single source of truth in the delegated principles severity catalog; criteria declare no severity or gray-zone rules
      - "Document reference severity catalog: relative docs path from SKILL files critical, path-only mentions major, related-documents section minor"
      - "Term severity catalog: unlinked glossary term in body critical, bracketed term absent from glossary critical, naming issue minor"
      - Exclusion of findings based on ADR rejection rationale only while its premises still hold, recording the ADR number and section
