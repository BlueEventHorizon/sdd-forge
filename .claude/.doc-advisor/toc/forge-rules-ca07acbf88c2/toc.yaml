  plugins/forge/docs/additive_development_spec.md:
    title: Additive Development Workflow Specification
    purpose: Defines the criteria and procedures for the additive development workflow that adds features to existing projects, covering when a feature namespace and temporary feature marker are required, replacement of old specs during implementation, and the merge procedure after implementation completes.
    content_details:
      - Definition of feature as a namespace that separates groups of requirements
      - Three types complete new pure additive and differential development judged per document kind
      - Requirements and design types may differ so design can be differential while requirements are not
      - Criteria for needing a feature old spec exists meaning changes and bug fixes are excluded
      - Exception allowing direct edit without a feature when scope is small and no qualitative red flag applies
      - Prohibition on AI replacing user-specified feature names including base and core
      - New spec replaces old spec without conditions during implementation
      - Old spec documents are not rewritten during implementation and implementation runs in an isolated worktree
      - Merge defined as semantic integration with sorting into revise move or keep separate and deletion of additional documents
      - Temporary frontmatter feature_type temporary-feature attached to differential documents
