  plugins/forge/docs/document_style_guide.md:
    title: Document Style Guide
    purpose: "Generic writing style for requirement, design, and plan documents: tag usage, heading levels, emphasis, reference notation, placeholder naming, no history or related-document sections, and terminology."
    content_details:
      - Tags MANDATORY, CRITICAL, and IMPORTANT placed at the end of the heading line, with MANDATORY limited to 0 to 3 per document under criteria A to E
      - Heading levels limited to H1 through H4 with one H1 per file
      - Emphasis phrases NEVER, MUST, DO NOT, ALWAYS, italics avoided, and GFM alert types NOTE, TIP, IMPORTANT, WARNING, CAUTION
      - Long vowel omission per JIS Z 8301 for words such as directory, category, and entry
      - "Three reference systems: plugin docs use relative links, SKILL and agent files use full CLAUDE_PLUGIN_ROOT paths, and project documents use ID or relative path links"
      - Reference-style link definitions collected at the document end so that moving a file needs only definition edits
      - Placeholder names such as Foo, Bar, Hoge, Fuga with type suffixes instead of concrete domain terms
      - No history sections or migration narratives; history belongs to CHANGELOG and git
      - No related-document list sections; only external URLs or consolidated references are allowed
      - "Terminology: glossary terms written in brackets at every body occurrence, defined first, and reused unchanged by downstream documents"
    applicable_tasks:
      - Writing a new requirement, design, or plan document in the house style
      - Reviewing a document for tag misuse, heading depth, or emphasis conventions
      - Checking document reference notation for project documents and plugin docs
      - Auditing documents for history sections or related-document list sections
      - Applying bracketed terminology and glossary links in a document body
      - Naming placeholder examples in rule or guidance documents
    keywords:
