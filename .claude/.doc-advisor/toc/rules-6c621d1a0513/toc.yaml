  docs/rules/plugin_claude_code_authoring_guide.md:
    title: Claude Code Authoring Guide (SKILL / Custom Agent)
    purpose: Defines project-independent conventions for combining SKILLs and custom Agents in plugins, covering launch path selection, custom Agent constraints, defense-in-depth layers, and invocation rules.
    content_details:
      - "Launch path naming: use the reference short names (inherited SKILL, fork SKILL, general-purpose Agent, custom Agent, Bash subprocess) and avoid bare subagent"
      - subagent_type must be a built-in or defined custom Agent name, and prompts must not contain slash notation
      - "Launch path selection order: Bash subprocess, general-purpose Agent, custom Agent, then inherited SKILL"
      - "Custom Agent criteria: same role used from multiple callers, constant write boundary, or parent context bloat"
      - Custom Agent frontmatter fields name, description, tools, model, with negative prohibitions on nested launch, task takeover, and writes outside the allowlist
      - Inherited SKILL arguments stay minimal and never carry parent context, issue bodies, or diffs
      - "Defense-in-depth layers A to D: Agent boundary, role constraint, tools or allowed-tools allowlist, and settings permissions.deny"
      - Fork SKILL (context fork) is avoided by default due to known defects listed in the reference
      - Cross-skill calls are written as instructions to Claude and self-invocation via the Skill tool is prohibited
      - Agent completion is awaited by ending the turn, not by ScheduleWakeup
    applicable_tasks:
