  docs/rules/implementation_guidelines.md:
    title: Plugin Implementation Guidelines
    purpose: "Defines plugin-independent rules for implementing Claude Code plugin scripts (Python and Bash) and SKILL.md: dependencies, tests, placement, temp files, error handling, and the boundary between distributed and development-only documents."
    content_details:
      - Python scripts use the standard library only; Bash is used for external commands and file operations
      - Distributed .py scripts require tests named test_{module}.py; SKILL.md is exempt and AI-judgment tests stay out of the CI gate
      - SKILL.md must not contain inline script logic; it calls independent scripts instead
      - "Placement: skills/{skill}/scripts and docs for single-skill assets, plugin-root scripts and docs for shared assets; no direct reference into another skill"
      - Temp files are written with the Write tool under .temp/<plugin>/<skill>/ with the session ID in the name, not via heredoc or the mktemp default
      - Distributed files must not reference development-only documents by path or spec ID
      - Other components are reached only through the public argument and output contract of their SKILL
      - Unused code is deleted rather than commented out or marked deprecated
      - Scripts parse structured data only; user input interpreted by AI is not passed to script parsers
      - Fallbacks are written only when they are explained as correct recovery; otherwise errors are reported
      - Version-related files are not edited in ordinary work; the release procedure owns them
    applicable_tasks:
      - Implementing a new plugin Python or Bash script
      - Writing or revising SKILL.md for a plugin skill
      - Reviewing plugin implementation against placement and dependency rules
      - Designing error handling and fallback behavior for a plugin script
    keywords:
      - standard library only
      - test_{module}.py
      - CLAUDE_SKILL_DIR
      - CLAUDE_PLUGIN_ROOT
      - .temp directory
      - inline script in SKILL.md
