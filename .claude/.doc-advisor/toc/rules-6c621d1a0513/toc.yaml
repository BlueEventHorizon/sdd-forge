  docs/rules/forge_doc_access_principle.md:
    title: forge Document Access Principle
    purpose: "Defines the development rule for how forge internals (SKILL, agent, scripts) reach documents: two routes only, direct reference to built-in docs and query for project specs and rules, with anti-patterns to avoid."
    content_details:
      - "Route A: direct reference to forge built-in docs at CLAUDE_PLUGIN_ROOT/docs/ or same-skill CLAUDE_SKILL_DIR/docs/ paths"
      - "Route B: query project specs and rules via /forge:query-db-specs and /forge:query-db-rules"
      - "Restriction: a skill must not directly reference another skill skills/{skill}/docs/ files; shared docs are promoted to plugins/forge/docs"
      - "Rationale: built-in docs travel with forge releases so fixed paths stay valid, while project specs change often so queries are needed"
      - "Anti-pattern: querying built-in docs when a fixed path suffices"
      - "Anti-pattern: referencing project specs or rules from distributed files by path or spec ID"
      - "Anti-pattern: passing session_dir and exchanging results through files as a third route"
      - "External use: /forge:query-forge-rules is the end-user entry point for built-in docs and is outside this principle"
    applicable_tasks:
      - Designing how a forge SKILL, agent, or script references documents
      - Reviewing document reference paths in forge SKILL.md files and agents
      - Modifying document lookup logic in forge skills
      - Deciding whether a shared document should be promoted to plugins/forge/docs
    keywords:
