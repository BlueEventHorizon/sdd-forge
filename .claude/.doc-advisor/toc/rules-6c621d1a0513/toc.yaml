  docs/rules/plugin_uv_usage_rules.md:
    title: uv Usage Rules
    purpose: "Defines rules for running Python scripts and managing their dependencies with uv: declaration placement, locking, updating, Python version selection, and a 3-day exclude-newer policy against freshly published package versions."
    content_details:
      - "Applicability: applies only when project instructions mandate uv; standard-library-only scripts are exempt from dependency management"
      - "Declaration placement: PEP 723 inline metadata for standalone and distributed scripts, pyproject.toml with package = false for multi-script groups with shared modules and tests"
      - Distributed scripts cannot use pyproject.toml, so shared-module dependencies are declared in every importing entry script
      - "Execution: run Python scripts with uv run, never bare python3; Python version and dependencies declared per script"
      - Dependency add and remove via uv add --script with --bounds lower and uv remove --script; version numbers are never written by hand
      - "Lock file: uv lock --script after adding, committed with the script including distribution hashes; uv run --locked detects mismatches"
      - "Update procedure: uv tree --script --outdated, then uv lock --upgrade or --upgrade-package, reviewing the lock diff before commit"
      - exclude-newer = 3 days in the script [tool.uv] metadata, with exclude-newer-package for urgent security fixes
      - requires-python lower bound follows the latest stable Python; pick the newest non-prerelease from uv python list
    applicable_tasks:
      - Setting up uv-based execution for Python scripts
      - Adding or removing dependencies in a PEP 723 script or pyproject.toml
      - Creating or maintaining uv.lock lock files for Python scripts
      - Reviewing and upgrading outdated dependencies with uv lock --upgrade
      - Deciding dependency declaration placement for new Python scripts
      - Reviewing the exclude-newer supply-chain safeguard configuration
      - Selecting the Python version for requires-python
    keywords:
