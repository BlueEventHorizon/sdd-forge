  docs/rules/agent_data_exchange_rules.md:
    title: Agent Data Exchange Rules
    purpose: Defines rules for exchanging transient data between SKILL and custom Agent during processing cycle, ensuring data integrity regardless of size
    content_details:
      - Identification values only - script generates, AI passes unchanged
      - Data written by script, not AI - values not generated or summarized
      - Path-based reading - reader obtains absolute path and reads directly
      - Value integrity - no omission, transformation, or fragmentation
      - Meaning in definition - SKILL/agent definition holds field semantics
      - Deterministic writing - complete before writing, no overwriting
      - Exit values for success/failure - normal is zero, errors as closed set
      - No runtime format validation
      - Absolute paths allowed for transient data
