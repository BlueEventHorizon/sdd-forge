  docs/rules/plugin_implementation_guidelines.md:
    title: Plugin Implementation Guidelines
    purpose: Defines plugin-independent rules for implementing plugin scripts and SKILL.md, covering language choice, testing, file placement, temp file handling, fallback policy, and version file editing.
    content_details:
      - "Language choice: Python for structured data processing, Bash for external commands and file operations, Python standard library only unless the user approves a third-party library"
      - Distributed Python scripts require tests named test_module.py with test directories named after the skill, and AI judgment tests are kept out of the CI gate
      - No processing logic inline in SKILL.md; logic goes into independent scripts that SKILL.md only invokes
      - Skill-specific scripts and docs go under skills/skill/, plugin-shared ones at plugin root, and other skills internal directories are never referenced
      - Temp files are written with the Write tool to .temp/plugin/skill/ with session ID in the name, never via shell heredoc, trap cleanup, default mktemp location, or fixed names
      - Distributed files such as SKILL.md, agents, commands, and bundled docs must not reference development-only documents by path or spec ID, while script comments and docstrings are exempt
      - Other components are reached only through SKILL.md argument and output contracts, never by calling their scripts directly or reimplementing their design
      - Scripts handle structured data only (YAML or JSON), and user input interpreted by AI is never parsed by script parsers
      - Fallbacks are allowed only when they can be explained as correct recovery for the abnormal case, otherwise the error is reported explicitly
      - Version-related files such as plugin.json version, marketplace version, README version table, CHANGELOG, and git tags are not edited in ordinary work
    applicable_tasks:
      - Implementing or modifying Python or Bash scripts in a plugin
      - Writing or editing SKILL.md files that call scripts or handle temp files
      - Reviewing test requirements for distributed scripts and their directory naming
      - Deciding placement of scripts and docs between skill directories and plugin root
      - Designing error handling and fallback behavior in plugin scripts
      - Editing version-related files during feature work, refactoring, or release
    keywords:
