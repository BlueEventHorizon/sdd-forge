  docs/rules/forge_doc_access_principle.md:
    title: forge Document Access Principle
    purpose: "Defines the two routes by which forge internals reach documents: direct reference to built-in docs and query-based discovery of project specs and rules. Also lists prohibited access patterns for developers of the forge plugin."
    content_details:
      - "Route A direct reference to forge built-in docs via CLAUDE_PLUGIN_ROOT or the same skill's CLAUDE_SKILL_DIR docs"
      - Route B query access to project specs and rules via query-db-specs and query-db-rules
      - "Rule that a skill may directly reference only its own docs and never another skill's docs/*"
      - Rationale that built-in docs have fixed paths while project docs change often and need dynamic discovery
      - "Anti-patterns: querying built-in docs, referencing project docs from distributed files, putting procedures in docs, passing session_dir for file-based results, referencing other skills' docs"
      - Promotion rule moving docs needed by multiple skills to the plugin-shared plugins/forge/docs
      - Note that the external-use entry point query-forge-rules is outside this principle
