  docs/rules/plugin_implementation_guidelines.md:
    title: Plugin Implementation Guidelines
    purpose: "Defines plugin-independent implementation rules for Claude Code plugin scripts and SKILL.md: language and dependencies, testing, file placement, temp files, distribution references, and fallback policy."
    content_details:
      - "Script language table: Python for structured data processing, Bash for external commands and file operations"
      - Python scripts use the standard library only, and any external library needs user approval
      - Distributed .py files require tests named test_{module}.py, while AI judgment tests stay outside the CI gate
      - SKILL.md must not contain inline processing logic; it calls independent scripts via CLAUDE_SKILL_DIR
      - "Placement: skills/{skill}/scripts and docs for single-skill assets, plugin root for shared assets, and no direct reference into other skills directories"
      - Temp files are written with the Write tool to .temp/plugin/skill with session ID in the filename, never via mktemp or heredoc
      - Distributed files must not reference development-only documents by path or spec ID, while script comments are excluded
      - Other components are reached only through SKILL public arguments and outputs, and AI must not parse user input with script parsers
    applicable_tasks:
