  docs/rules/forge_claude_code_authoring_policy.md:
    title: Claude Code authoring policy (forge)
    purpose: "Authoring policy that forge and local skills adopt on top of the general Claude Code guide: the SKILL execution model, rules for inherited SKILLs and custom agents, and how questions are asked to the user."
    content_details:
      - Confirm official specs with the claude-code-guide Agent before writing since citations are summaries
      - All SKILLs are written as inherited type with no context fork or agent field, checked by test_no_fork_skill
      - Work needing isolated context goes to custom agents launched via the Agent tool as plugin:name
      - An inherited SKILL must state at its opening that it only does X and must not take over other work of the parent
      - A new custom agent needs its rationale recorded in the plugin design doc and a test verifying Role constraints
      - Questions and confirmations use AskUserQuestion rather than plain text
      - Discussion-driven SKILLs present background, essence, recommendation and options in prose as an exception
      - Do not seal questions with disallowed-tools AskUserQuestion because it fails across multiple turns
      - SKILL.md descriptions are written in Japanese
      - Individual SKILL construction follows the meta plugin author-skill
    applicable_tasks:
      - Creating or modifying a forge SKILL that follows the inherited execution model
      - Creating a new custom agent for forge
      - Reviewing SKILL and agent definitions against the forge authoring policy
      - Writing user confirmation steps in SKILL.md
