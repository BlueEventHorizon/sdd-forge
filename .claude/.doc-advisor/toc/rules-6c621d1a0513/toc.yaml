  docs/rules/script_error_output_rules.md:
    title: Script Error Output Rules
    purpose: "Defines how Python scripts return exit codes and errors: 0, 1, and 2 have fixed common meanings, codes 3 and above are declared only in the returning script docstring, and errors are reported as JSON on stdout."
    content_details:
      - Exit codes 0 (completed), 1 (generic failure), and 2 (argparse argument error); codes 3 and above are meaningful only in the script that returns them
      - "Result content does not decide completion: zero findings or no changes still exit 0 with details in the stdout JSON"
      - Scripts returning codes 3 or above must declare the full exit code table, including 0, in their module docstring
      - Callers branch on a value only when the producing docstring declares it; undeclared values and code 1 are reported as generic errors
      - "Stdout format: result JSON on 0, error JSON with an errors array of natural-language strings on non-zero, except argparse code 2"
      - Diagnostics may go to stderr, but error content must also appear in the stdout JSON
      - "Exception: scripts whose I/O contract is fixed by a harness such as Claude Code hooks follow that contract"
      - Applies to newly placed scripts; existing scripts are revised at opportunities for change
    applicable_tasks:
      - Implementing exit codes and error output for a new Python script
      - Reviewing script error handling and exit code declarations
      - Writing caller logic that branches on script exit codes in SKILL.md
      - Adding an exit code table to a script module docstring
    keywords:
      - exit code
      - errors array
      - module docstring
      - argparse exit 2
      - stdout JSON
      - stderr
      - exit code declaration
      - harness hook
