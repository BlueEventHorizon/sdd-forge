  docs/rules/plugin_claude_code_reference.md:
    title: Claude Code Reference (SKILL / Plugin / Agent)
    purpose: Collects sourced facts about Claude Code launch paths, subagent_type values, and Agent behavior that plugin authors rely on, including known official issues affecting fork SKILLs.
    content_details:
      - "Five launch paths with short names: inherited SKILL, fork SKILL, general-purpose Agent, custom Agent, and Bash subprocess, each with trigger, instruction source, context inheritance, and output form"
      - "Known official issues for context fork (#18394, #34164, #60720, #55592, #34328, #19751, #17283, #17351, #68233) with Anthropic response status"
      - Recommendation to avoid fork SKILL by default based on the listed context fork issues
      - "subagent_type value range: built-in names general-purpose, Explore, Plan, claude, statusline-setup, claude-code-guide"
      - Plugin Agents use a plugin-name namespace such as deploy-tools:reviewer
      - SKILL names, slash notation, and file paths are invalid as subagent_type
      - Agent tool in interactive sessions has no run_in_background argument, so agents run in background and results arrive by completion notification in a later turn
      - Background subagents lacked AskUserQuestion even when listed in tools, with cause unconfirmed
      - ScheduleWakeup is a scheduling tool for /loop dynamic mode, and harness notifies background completion
      - "Source notation rules: Claude Code behavior needs a source line with date, version, and source, while unknown dates and unverifiable items are marked explicitly"
