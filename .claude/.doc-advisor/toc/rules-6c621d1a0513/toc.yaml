  docs/rules/forge_agent_data_exchange_rules.md:
    title: Data exchange with agents
    purpose: "Norm for passing one-time request and result data between a SKILL and custom agents: pass only identifiers, scripts write data, readers use returned paths, and a terminal value signals success."
    content_details:
      - Pass only script-generated identifiers between SKILL and agent and never the data body
      - Scripts write data while AI never assembles JSON and values are stored unchanged
      - Drafts stay hidden until complete and are then published in one operation
      - Readers receive an absolute path from the script and read the file directly
      - Script withholds the path and fails when data is not ready to read
      - Values survive intact including newlines, quote-like and special characters and non-ASCII text
      - Field meanings live in SKILL and agent definitions rather than in transmitted values
      - Success is terminal value 0 with a closed error-value set judged by the script
      - No runtime format validation and no overwrite operation after writing
      - Temporary data is deleted after processing and permanent documents are out of scope
    applicable_tasks:
      - Designing data handoff between a SKILL and a custom agent
      - Implementing request and result passing through scripts
      - Reviewing agent data exchange design or implementation
      - Modifying script-written result files exchanged with agents
