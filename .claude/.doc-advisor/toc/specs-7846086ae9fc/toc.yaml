  docs/specs/common/requirements/COMMON-REQ-001_versioned_migration.md:
    title: "COMMON-REQ-001: Versioned Migration Requirements"
    purpose: Defines a stepwise migration framework that converts versioned data from older formats to the current version one version at a time, using pure migration functions registered in a registry, so newer applications can read older data.
    content_details:
      - "FR-01 version detection: detect the integer major version from data, treat a missing version identifier as v1"
      - "FR-02 stepwise migration: apply migrations one version at a time (v1 to v2 to v3, no direct jump), in ascending order for detected < v <= current"
      - FR-02 registry keyed by target version, each function receives the previous version output as input (chain execution)
      - "FR-03 migration function contract: input is the previous version format, output is the target format, idempotent, no side effects such as file I/O or network"
      - "FR-04 error handling: exceptions in pure migration functions propagate as code bugs with no silent fallback, unknown future versions are skipped, detection failure is treated as the oldest version"
      - "FR-05 extensibility: a new version needs one migration function, one registry entry and a CURRENT_VERSION update, existing functions unchanged (Open-Closed)"
      - NFR-01 in-memory conversion only without rewriting original data, NFR-02 standard library preferred and external libraries need user approval
      - Applied to .doc_structure.yaml via migrate_doc_structure.py using the doc_structure_version comment
    applicable_tasks:
      - implementation of versioned data migration logic
      - addition of a new data format version migration
      - review of backward compatibility handling for versioned data
      - modification of migrate_doc_structure.py migration behavior
    keywords:
      - apply_migrations
      - MIGRATIONS registry
      - CURRENT_VERSION
      - detected_version
      - stepwise migration
      - backward compatibility
      - migrate_doc_structure
      - doc_structure_version
      - pure migration function
  docs/specs/common/requirements/COMMON-REQ-002_error_handling_policy.md:
    title: "COMMON-REQ-002: Error Handling Policy Requirements"
    purpose: Defines the error handling policy that forbids silent fallbacks hiding internal bugs, limits exception catches to external-cause errors with specific types, and requires errors to be reported to callers across all Python scripts and SKILL.md files.
    content_details:
      - FR-01 exception catching limited to external-cause errors, broad except Exception or bare except forbidden, internal bugs such as TypeError KeyError IndexError AttributeError propagate
      - "FR-02 allowed catches: file I/O errors (FileNotFoundError IOError OSError UnicodeDecodeError), network errors (ConnectionError TimeoutError), and ValueError from type conversion with the try block limited to the conversion"
      - FR-02-4 except Exception allowed only for HTTP server request handling with handle_error
      - FR-03 caught errors must be reported to callers, destination and format defined by the script error output rules
      - FR-04 exceptions in pure functions (fn(data) returns data) are code bugs, no try/except rollback or original-data return, guaranteed by tests instead
      - Correct and forbidden code patterns for load_config and apply_migrations
      - "Decision flowchart: external cause means catch with specific type and report, otherwise propagate, pure function means no try/except"
      - Applied history table of versions v0.0.25 and v0.0.26 removing except Exception across the project
    applicable_tasks:
