    title: REQ-024 Implementation Plan Specification Requirements
    purpose: "Defines the information an implementation plan must hold: task identifiers, priority, dependencies, traceability to requirements and designs, task granularity, task groups, and plan lifecycle rules."
    content_details:
      - "Task identity: each task has a unique identifier, a priority for ordering, and the identifiers of the tasks it depends on"
      - "Dependency rule: a task depends on another when it needs that task's code, types, contracts or data, or when both change the same target"
      - "Deterministic next-task selection: task states are not started, in progress, implemented, completed and failed; a not-started task is runnable when all prerequisites are completed, with same-group predecessors allowed to be implemented"
      - "Traceability: requirement to design to task mapping, with detection of requirements or designs that lack a task"
      - "Task granularity: a single executor agent completes one task without waiting for other tasks"
      - Each task holds the paths of the documents needed for its implementation
      - Plan is a disposable work file not meant for permanent storage; the user decides whether to delete or keep it
      - Plan holds no differential feature identifier; it is resolved by following the traced requirement identifier (REQ-025 FNC-001)
      - "Task groups: several tasks form one group that is the unit of selection, build check and review, with the build verified at the group's last task"
    applicable_tasks:
      - Creating an implementation plan from a design document
      - Modifying the implementation plan structure or task state model
