  docs/specs/forge/design/DES-022_parallel_agent_output_contract_design.md:
    title: DES-022 Parallel Agent Output Contract Design
    purpose: "Defines the output contract for parallel Agent tool launches: agents return results as return values and never write shared files, so write races are prevented; orchestrator alone writes artifacts"
    content_details:
      - "Race condition problem: parallel agents writing the same shared YAML or JSON file overwrite each other because the Agent tool provides no process-level locking"
      - "Basic principle: agents pass results only as Agent tool return values, never through shared resources or intermediate files"
      - Collector agents (search, investigation, review) must not write artifacts; the orchestrator writes artifacts once in the main context after all agents complete
      - Ban on intermediate files and session directories for passing agent results, with rationale that return values need no naming, collection, cleanup, or merge machinery
      - "Agent responsibilities: return results via return value, return self-contained results, Read is unrestricted"
      - "Orchestrator responsibilities: wait for all agents, merge return values in main context, write artifacts, decide partial-failure policy (collectors fail-open per DES-013)"
      - "Scope: applies to the result-delivery path; write-type agents editing their assigned artifacts are governed by scope separation in REQ-001 FNC-004; per-document data exchange is governed by agent_data_exchange_rules"
      - "Anti-patterns: shared file direct writes, agent-side Read-Modify-Write, file locking via flock, per-agent result files"
      - Checklist of five items for designing new parallel agents
    applicable_tasks:
      - Designing a new parallel agent workflow with result collection
      - "Reviewing whether an agent's output path avoids shared-file writes"
      - Implementing orchestrator merge of agent return values
      - Reviewing collector agent write behavior in create or review skills
      - Deciding whether intermediate files are allowed for agent result passing
    keywords:
      - parallel agent
      - return value
      - output contract
      - race condition
      - shared file write
