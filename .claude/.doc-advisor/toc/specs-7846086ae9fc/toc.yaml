  docs/specs/common/requirements/COMMON-REQ-002_error_handling_policy.md:
    title: "COMMON-REQ-002: Error Handling Policy Requirements"
    purpose: Defines a policy that prohibits silent fallbacks hiding internal bugs and limits exception catching to external-cause errors, applied to all Python scripts and SKILL.md files in the project.
    content_details:
      - Exception catching limited to external-cause errors, with broad catches such as except Exception and bare except prohibited (FR-01-1, FR-01-2)
      - Internal bugs such as TypeError, KeyError, IndexError and AttributeError propagate to the caller (FR-01-3)
      - "Permitted catches: file I/O errors FileNotFoundError, IOError, OSError, UnicodeDecodeError (FR-02-1)"
      - "Permitted catches: network errors ConnectionError and TimeoutError (FR-02-2)"
      - "Permitted catch: ValueError from int() conversion, with the try block limited to the conversion only (FR-02-3)"
      - except Exception allowed only in HTTP server request handling as a framework pattern that calls handle_error() (FR-02-4)
      - Error information must reach the caller via exit code, stdout or stderr per the script error output rules (FR-03)
      - Exceptions inside pure functions fn(data) to data are code bugs, with no try/except rollback and test-based guarantees (FR-04)
      - "Anti-pattern: silent fallback returning the original data on except Exception in apply_migrations (design patterns)"
      - "Applied history: except Exception narrowed in toc_utils.py to IOError and OSError, and in resolve_doc_references.py to specific types"
    applicable_tasks:
