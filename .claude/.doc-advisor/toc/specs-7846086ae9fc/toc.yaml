  docs/specs/review/requirements/REQ-027_reviewer.md:
    title: REQ-027 Reviewer Input, Work, and Output Contract Requirements
    purpose: "Defines reviewer behavior: how it reads targets by targets shape, how it determines target type (code, requirement, design, plan, uxui), which criteria and norm documents apply per type, and which findings and error value it returns. The shared exchange contract is in REQ-029."
    content_details:
      - "Target type determination: code, requirement, design, plan, uxui, using .doc_structure.yaml declaration resolved by resolve_doc_structure.py first and file content only when undetermined"
      - "Reading targets by shape: paths read in full (directories enumerated by reviewer), base_branch and diff derived from the diff with deletions and renames included"
      - "Common documents for all target types: review_criteria_generic.md, review_priorities_spec.md, scope_proportionality_spec.md, error_classification_spec.md"
      - Per-type criteria files review_criteria_code/requirement/design/plan/uxui.md and built-in norms for each type (e.g. deterministic_generation_spec.md and forge_anti_patterns.md for code)
      - Undetermined target type is not an error; the target is reviewed with common documents only and never guessed into one type
      - "Findings: no finding is returned when none exist; reviewer never branches its contract by reviewer type"
      - Sole error value target_unreadable for nonexistent paths or undiffable branches; unreadable internal documents are not given an error value
      - Secret and confidential information scanning is out of reviewer scope and handled by a separate inspection
