      - "Parallel-capable structure FNC-004: results returned as agent return values, no shared intermediate files, identifier-only passing via script-written JSON path, no document bodies pasted into prompts"
      - "Document format criteria FNC-005: JSON for machine-updated plans with task ID, priority, dependencies and status; Markdown for requirements and designs with mermaid diagrams"
      - "Common finalize flow FNC-006: review with --files and --auto, update-db-specs for ToC update, commit confirmation; no independent finalize skill"
      - "AI-driven input interpretation FNC-007: no argument-parsing scripts, AskUserQuestion fills missing arguments, scripts limited to YAML and JSON processing"
      - "Applicability table: review, start-design, start-plan, start-requirements and start-implement with their data passing methods"
      - "Background: God-Skill problems of context consumption, instruction-following degradation, no parallelism and loss by context compaction"
