      - adr_exchange.py subcommands open request-path finish check and which caller invokes each
      - Closed judgement set created rejected insufficient recorded by finish and returned by check
      - "Destination rule: one ADR-NNN_feature.md per feature, with an error when adr_dir holds two or more ADR files"
      - Request kinds approval-record judgement update and the baseline_sha256 consistency check in finish
      - Exit codes limited to 0 1 2 with an errors array in the JSON output on failure
      - Rationale for an Agent instead of context fork, including the isolation of the write boundary
