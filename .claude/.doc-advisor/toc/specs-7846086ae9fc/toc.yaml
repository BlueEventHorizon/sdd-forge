  docs/specs/review/requirements/REQ-029_review_exchange.md:
    title: REQ-029 Common Contract Requirements for the Review Mechanism
    purpose: "Defines the common review contract: round flow between review body and reviewer/evaluator agents, finding_id numbering, exit values, request and result data structures, and body responsibilities"
    content_details:
      - "Round flow sequence: body generates review_id, runs reviewer then evaluator per round, and deletes retained data at review end"
      - Only review_id and round_number are passed between body and agents; scripts assemble inputs and return verified absolute paths
      - Request structure (DM-301) with targets, focus, scope, references; target keys paths, base_branch, diff; request is fixed for the whole review
      - finding_id assigned by script as one continuous sequence per review, never renumbered, evaluator-added findings continue after reviewer maximum
      - "Exit value rules (FNC-311): string 0 for normal completion, closed set of error values, unwritten abnormal end treated as error"
      - Result structure (DM-305) for reviewer findings and evaluator evaluations, each carrying an exit value
      - "Evaluation fields (DM-201): disposition valid/invalid/misunderstanding/out_of_scope/flawed_premise, severity critical/major/minor, confidence confirmed/inferred/unverified, fix_confident boolean"
      - "Termination (FNC-318): no valid or flawed_premise disposition remains, or user decides to end; retains_context selects branch (FNC-316)"
      - flawed_premise is never auto-fixed, even in auto mode (FNC-204)
      - "Path and location notation (DM-304): absolute paths in transient JSON, location as file:line or file:start-end, placeholder marker when position cannot be identified"
    applicable_tasks:
      - Implementation or modification of the review mechanism
      - Contract design review of reviewer and evaluator agent interaction
      - Implementation or modification of the review body that drives rounds
      - Implementation of finding_id numbering and exit value handling
      - Creation or modification of review request and result data structures
    keywords:
