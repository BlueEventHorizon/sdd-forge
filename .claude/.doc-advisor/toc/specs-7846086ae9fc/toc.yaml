  docs/specs/review/requirements/REQ-026_evaluator_perspective.md:
    title: REQ-026 Evaluator Independent Evaluation and Meta Perspective Requirements
    purpose: "Defines evaluator behavior for review findings: meta perspectives for judging disposition (root cause, source accuracy, ADR limits), adding new findings, and no error values. Shared contract is REQ-029."
    content_details:
      - "FNC-201 five meta perspectives: whether the cited cause is the real root cause, whether shared root causes exist across findings, whether source development docs or code are wrong, ADR limited to procedural and logical consistency checks"
      - "FNC-201 rule: try the most reasonable purpose-based reading of findings and norm documents first, suspect flawed_premise only when that fails"
      - FNC-201 forbids fabricating a shared root cause that does not hold; a no-cause judgement is written in reason only when needed
      - "FNC-206 new findings: a finding_id is assigned by script for issues matching no reviewer finding, location stated explicitly, disposition fixed to valid"
      - "FNC-208 evaluator definition: script calls for input and evaluation output, finding-first reading, target type judgement and document mapping shared with reviewer (FNC-307 FNC-308)"
      - "FNC-209 output: all findings are read before evaluations are fixed, findings bundled into one evaluation, zero evaluations with termination value 0"
      - FNC-319 evaluator has no error values; only normal termination 0 is passed, unreadable target yields invalid or misunderstanding
      - "DM-202 input: request (DM-301) and findings (DM-302) read separately, no merged input file"
      - TBD-001 practical effectiveness of meta perspectives unverified until implementation
    applicable_tasks:
      - Implementation of the evaluator agent definition (evaluator.md)
      - Review of evaluator behavior and meta perspective design
      - Design of disposition judgement rules for review findings
      - Modification of evaluator output and new finding handling
