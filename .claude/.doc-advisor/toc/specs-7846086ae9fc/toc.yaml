  docs/specs/common/adr/ADR-089_common.md:
    title: ADR-089 common Decision Record for Retaining the Responsibility Declaration in Inherited-Type SKILLs
    purpose: Records the decision to keep the norm requiring a responsibility declaration at the top of every inherited-type SKILL, even though no current problem occurs, and rejects deleting it
    content_details:
      - "Background: fork-type SKILLs are not adopted because of unfixed Claude Code bugs such as $ARGUMENTS not being substituted and output not reaching the Desktop UI"
      - Inherited-type SKILLs have no context isolation from the parent, so the SKILL must declare its own scope instead
      - "Decision: retain the responsibility declaration norm at the top of every inherited-type SKILL and do not delete it"
      - The declaration states that the SKILL performs only its own scope and does not take over other parent-session work such as implementation, PR creation or Issue updates
      - Scope applies to all inherited-type SKILLs regardless of launch path, including SKILLs launched from other SKILLs
      - "Rejected alternatives: deleting the norm because no problem currently occurs, and limiting the norm to SKILLs launched from other SKILLs"
      - Deleting the norm would require consistent removal across norms, design documents, tests and each SKILL wording
    applicable_tasks:
      - Review of the responsibility declaration norm for inherited-type SKILLs
      - Deletion or revision proposal for the responsibility declaration norm
      - Authoring the responsibility declaration in a new inherited-type SKILL.md
      - Evaluating whether a fork-type SKILL should be adopted instead of an inherited-type SKILL
