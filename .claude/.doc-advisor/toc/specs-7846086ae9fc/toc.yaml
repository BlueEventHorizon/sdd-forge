  docs/specs/review/design/DES-083_evaluator_perspective_design.md:
    title: DES-083 Evaluator Independent Evaluation and Meta-Perspective Design
    purpose: Defines the evaluator design that judges reviewer findings and writes evaluations, and the main body handling of findings, evaluations, round advancement, and cleanup in the review flow (S10-S20).
    content_details:
      - evaluator reads the request and reviewer findings, starts from each finding, judges its validity, and adds new findings via --new
      - evaluation record shape with variable-length finding_ids, disposition, severity, reason, confidence, fix_confident, and location required only for new findings
      - five meta perspectives reflected in evaluation shape rather than self-reported checklist
      - wrapper scripts evaluator_resolve_inputs, evaluator_add_evaluation, evaluator_finish and their arguments
      - append_result.py and seal_result.py guarantees for referenced finding numbers, location presence, and sealed exit
      - finding_id numbering as a single sequence shared by reviewer and evaluator within one review
      - main body S15-S20 handling via body_resolve_findings and body_resolve_evaluations, count_actionable.py, and advance_round.py capped at round 5
      - consult interim measure that stops using agenda and keeps review state in conversation context
    applicable_tasks:
      - evaluator implementation or modification
      - review SKILL main body modification for evaluation handling
      - evaluation JSON schema and append_result or seal_result script modification
      - review round progression and finding-to-evaluation mapping review
      - consult interim agenda-free behavior review
    keywords:
