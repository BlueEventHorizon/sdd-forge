  docs/specs/common/adr/ADR-089_common.md:
    title: ADR-089 common Decision Record
    purpose: "Records decisions for common ADR items: keeping the responsibility declaration rule for inherited-type SKILLs even without current problems, and declaring uv exclude-newer settings in PEP 723 script or pyproject.toml metadata instead of command options."
    content_details:
      - Keep the responsibility declaration rule for inherited-type SKILLs, not deleted even when no problem currently occurs
      - "Rationale: inherited-type SKILLs have no fork isolation, so the declaration is a substitute defense against taking over unrelated parent work"
      - "Scope: applies to all inherited-type SKILLs regardless of launch path"
      - "Rejected alternatives: deleting the rule because no problem occurs, and limiting scope to SKILLs launched from other SKILLs"
      - Declare uv exclude-newer in PEP 723 script [tool.uv] or pyproject.toml [tool.uv] instead of --exclude-newer command options
      - "Rationale: lock and uv run --locked stay consistent without flags, and exclude-newer-package works in either location"
      - "Rejected: passing --exclude-newer to uv add, uv lock, or uv lock --upgrade, which makes uv run --locked fail with lockfile needs update"
      - UV_EXCLUDE_NEWER environment variable workaround depends on human and AI vigilance
      - Uv behavior verified only on uv 0.13.5 macOS
    applicable_tasks:
      - Creating or revising responsibility declarations for inherited-type SKILLs
      - Reviewing proposals to remove the responsibility declaration rule for SKILLs
      - Configuring uv exclude-newer for Python script dependencies
      - Reviewing uv lockfile update and uv run --locked procedures
      - Deciding placement of uv exclude-newer settings in pyproject.toml or PEP 723 metadata
    keywords:
      - inherited-type SKILL
      - fork-type SKILL
      - responsibility declaration
      - exclude-newer
      - exclude-newer-package
      - PEP 723
