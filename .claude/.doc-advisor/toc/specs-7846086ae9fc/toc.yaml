  docs/specs/review/requirements/REQ-029_review_exchange.md:
    title: REQ-029 Common Contract of the Review Mechanism Requirements
    purpose: "Defines the common review mechanism contract: exchange by review_id and round_number, script-built requests, finding_id numbering, exit-value success or failure, review body duties, and the JSON structures of requests and results."
    content_details:
      - Exchange of review_id and round_number only; the agent gets a verified absolute path from a script and reads the JSON file directly, with no JSON content passed through the agent
      - Request structure with targets (paths, base_branch, diff), focus, scope, and references; a request is published once and never changed during the review
      - Result structure of findings or evaluations plus an exit value; exit `0` means success and any other value is a defined error value
      - finding_id assigned by script as one sequence per review, never reset between rounds; evaluator new findings continue the same sequence
      - Every reviewer finding_id must be referenced by an evaluation before the evaluator writes its exit value
      - Evaluation disposition values valid, invalid, misunderstanding, out_of_scope, flawed_premise; severity values critical, major, minor taken from the criteria catalog
      - Termination when no valid or flawed_premise evaluation remains, or when the user decides to end; the loop applies when retains_context is false
      - flawed_premise is never auto-fixed, even in auto mode
      - Review body is the final decision maker and must verify findings itself rather than follow confidence or disposition values blindly
    applicable_tasks:
      - Implementation or modification of the exchange between review body, reviewer, and evaluator
      - Change of finding_id numbering rules across review rounds
      - Design or modification of review request and result JSON structures and exit value handling
      - Review of termination conditions and flawed_premise handling in the review loop
    keywords:
      - review_id
      - round_number
      - finding_id
      - retains_context
      - disposition
      - flawed_premise
      - exit value
      - FNC-313
      - FNC-318
      - DM-305
