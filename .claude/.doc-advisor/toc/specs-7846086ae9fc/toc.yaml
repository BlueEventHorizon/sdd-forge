    content_details:
      - Scenario table SC-01 to SC-27 mapping requirements FNC-001 to FNC-013 and NFR-001
      - "Task execution unit: one ungrouped task or one task group, with parallel execution only across units"
      - State transitions among pending, in_progress, implemented, completed, failed, with failure cascading to revert dependent implemented tasks to pending
      - "Task selection algorithm: priority ordering, task_id tie-break, group member expansion into task_ids and done_task_ids"
      - Result inspection RS-01 turning contract violations into FAILURE results
      - Review invocation via /forge:review with --diff, --scope, --project-rules and --project-specs including concurrent-state documents
      - "Group completion: scope derivation over all members, one review, final check, then completing all members together"
      - Task context file tasks/{context_id}.json beside the plan, with context_id format {task_id}-{8 hex}
      - Startup state no_plan, leftover, clear, and uncommitted-change confirmation (SC-27)
      - Plan JSON written only by state transition script via temp file and rename, with no locking
