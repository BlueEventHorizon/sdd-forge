      - "Orchestrator duties: wait for all agents, merge return values, and decide partial failure handling (fail-open for collection agents, DES-013)"
      - Application examples for context collection in start-requirements, start-design, and start-plan
      - "Anti-patterns: shared file direct write, Read-Modify-Write in agent, file locking with flock, and intermediate result files"
