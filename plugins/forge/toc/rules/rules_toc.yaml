    title: "追加開発ワークフロー仕様"
    purpose: "Defines the criteria and procedure for the additive development workflow used when adding features to an existing project, including feature namespaces, document types, and merge handling."
    content_details:
      - "Feature as a namespace and three types: fully new, purely additive, differential"
      - "Types are judged per document kind, so requirements and design can differ"
      - "When feature namespace names are needed or unnecessary, plus directory examples"
      - "Rule that the AI must not replace a user-specified feature name"
      - "Applicability: use a feature only when the specification meaning changes; bug fixes are excluded"
      - "Exclusion conditions for small changes and qualitative red flags"
      - "Old specifications are treated as replaced unconditionally during implementation"
      - "Old spec documents are not rewritten during implementation; isolated worktree recommended"
      - "Merge definition, scope-based decision on what to move or keep separate, and procedure"
      - "Temporary frontmatter definition is delegated to frontmatter_format.md"
