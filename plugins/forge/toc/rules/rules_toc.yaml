  plugins/forge/docs/adr_principles_spec.md:
    title: ADR Operational Principles
    purpose: "Defines principles for writing and revising ADRs: qualifying decisions, scope field conditions, review acceptance criteria, mutable revision rules, and ADR file placement and numbering."
    content_details:
      - Definition of ADR as a record of rejected alternatives for decisions that cannot otherwise be traced
      - "Exclusion list: spec or rule bodies, decisions evident from code, decisions with no real choice, obviously correct choices, and work history"
      - "Two-condition test: a plausible future proposal exists and code, rules, or specs do not show it is wrong"
      - Scope field is optional and written only when readers cannot tell what an ADR file decides
      - Review criteria table with reject, revise, and insufficient verdicts; approval records are never rejected
      - Decision revision rewrites the same section, keeps section numbers, and forbids changelog or status sections
      - Rejection of a decision merges the old alternative into the same section instead of adding a new ADR
      - One ADR file per feature, numbered once via next-spec-id with --share-prefixes ADR,DES
      - Severity catalog for ADR violations, with section-number changes rated critical
    applicable_tasks:
      - ADR creation for a newly settled design decision
      - ADR revision or rewrite of an existing decision section
      - Review of ADR content for acceptance or rejection
      - Judging whether a design change qualifies for an ADR
      - Deciding whether an ADR scope field is needed
      - Numbering and placement of an ADR file
