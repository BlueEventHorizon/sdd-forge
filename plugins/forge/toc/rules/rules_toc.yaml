      - Display follows the dialogue revision handling rules, with the discussed state added
      - Single issue case shows no list, only decision, summary, AI view, and position
      - Presentation state is kept in conversation context until an HTML generation script exists
      - No consult brief is recorded in creation mode because the identifier and storage location are undetermined
      - On finish the document is written from the agenda list, listing included and excluded items first
