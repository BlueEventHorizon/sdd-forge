  plugins/forge/docs/scope_proportionality_spec.md:
    title: Scope Proportionality Principle
    purpose: Defines the proportionality principle against over-design, limiting the three-point check to three speculative-defense categories and excluding catastrophic external failures from scope.
    content_details:
      - "Three applicable categories: catastrophic external defense, speculative defense with no concrete path or very rare cases, and unfounded immediate quality improvement fixes"
      - "Findings exempt from the three-point check: explicit requirement or rule violations, reproducible runtime bugs, data loss, security, destructive operations, and mandatory test violations"
      - A finding being discovered in review is not a reason to skip it
      - "Catastrophic external failures out of scope: OS-level kill, power loss, filesystem corruption, disk exhaustion, hardware failure"
      - Normal operation bugs such as logic bugs, data inconsistency, config errors, and race conditions remain normal fix targets
      - "Three-point check item 1: whether other preconditions are already broken when the trigger condition holds"
      - "Three-point check item 2: whether an independent existing safety net such as type checks, CI, or other-layer validation stops the failure before harm"
      - "Three-point check item 3: whether defense cost is balanced against the damage prevented, including the harm of added branches and hidden real errors"
      - Ambiguous applicability is treated as not applicable and handled as a normal fix target
      - Ambiguous three-point check result leads to skip or create_issue with the rationale recorded
    applicable_tasks:
      - Evaluating whether a fix proposal is over-engineered defensive code
      - Applying the three-point check to review findings before fix adoption
      - Deciding skip versus fix for speculative defense measures
      - Scoping error handling against catastrophic external failures
    keywords:
