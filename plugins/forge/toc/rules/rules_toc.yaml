      - Document-reference severity catalog items 3 to 8, where an unreachable reference path is critical
      - "Three conditions for create_issue: no applicable rule, recurrence or objectivity, and codifiable granularity"
      - "Fixed three sections of review criteria files: SSOT reference, check order, and judgment rules"
