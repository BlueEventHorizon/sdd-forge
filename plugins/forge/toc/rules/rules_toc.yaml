      - procedure for adding a new version by implementing a migrate function, registering it and bumping CURRENT_VERSION without changing existing functions
      - required test cases for previous-version conversion, multi-step chaining, idempotence, rollback, future-version skip and detection fallback
      - implementation example migrate_doc_structure.py for the .doc_structure.yaml format
