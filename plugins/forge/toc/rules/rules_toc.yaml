    title: Plan Creation Principles
    purpose: "Defines general principles for plan documents: structure, task IDs and priorities, granularity and grouping, dependencies, acceptance criteria, test rules, and traceability. Applies when no project rules exist."
    content_details:
      - "Plan definition: sole responsibility is the task set, priorities, dependencies, and traceability, so the next task is uniquely determined"
      - Plan JSON top-level keys limited to requirements_traceability, design_traceability, and tasks; file name {feature}_plan.json
      - design_traceability[].requirement_ids is mandatory as the only status-update path from design to requirements; requirements_traceability has no task_ids
      - "Task ID prefix TASK-xxx and priority ranges: 70-99 high (core and blockers), 40-69 medium, 1-39 low"
      - "Task granularity: one Agent execution per task, about 5-10 items, build and tests pass on completion"
      - "Task groups: group_id GROUP-001 (1/3) with build_check values per_task, skip, and on_group_complete; no temporary compatibility code in plans"
      - "required_reading: array of project-root-relative paths with no globs or bare IDs; empty array when none; strategy document included in every task"
      - Acceptance criteria must be yes/no judgeable; unit tests belong in the same task as the code change; integration and E2E tests become later independent tasks
      - Implicit dependency patterns such as types before usage, API before frontend screens, schema before migration, and build before deploy
      - "Traceability: every requirement ID must reach a task through its design without waiver; severity catalog maps violations to critical, major, or minor"
    applicable_tasks:
