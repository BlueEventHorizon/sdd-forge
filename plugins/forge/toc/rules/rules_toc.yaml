  plugins/forge/docs/document_style_guide.md:
    title: Document Style Guide
    purpose: Defines the standard writing style for documents generated, updated, and reviewed by the plugin, covering tags, headings, emphasis, structure, reference notation, and document organization principles.
    content_details:
      - "Tag usage and placement: three types [MANDATORY] / [CRITICAL] / [IMPORTANT], placed at end of heading line with single space before tag, not as separate paragraphs"
      - "Tag signal value maintenance: use tags sparingly (0-3 MANDATORY per document), criteria include irreversible damage, architecture collapse, legal requirement, irrecoverable decisions, AI error traps"
      - "Heading levels: only # through #### allowed (4 levels maximum), level 1 for file title only, level 2 for major sections, level 3 for subsections, level 4 for details"
      - "Emphasis and notation: bold for important terms, backticks for code/paths/filenames/commands, avoid italics for Japanese text, JIS Z 8301 long vowel suppression (directory not directory-)"
      - "GFM Alerts: [!NOTE] / [!TIP] / [!IMPORTANT] / [!WARNING] / [!CAUTION] for specific content emphasis, distinct from heading tags, kept short and focused per alert block"
      - "Structured elements: code blocks with language specification, lists (unordered with -, ordered with 1., max 2 nesting levels), tables with max 6 columns, no complex content in table cells"
      - "Document reference notation [MANDATORY]: system 1 (docs-to-docs relative paths), system 2 (SKILL/agents/commands to docs using placeholder prefix for plugin root), system 3 (project documents with ID or relative paths)"
      - "Reference link implementation: always use Markdown link syntax for readability, reference-style links for maintainability when refs move, do not use bare filenames or paths, ID documents can mention IDs as identifiers separately"
      - "Abstract example naming: use placeholders (Foo, Bar, FooService) not concrete domain names (Contact, UserManagement) to prevent staleness, generic terms for Japanese descriptions (Item not Contact, Category not Group)"
      - "No historical records in documents: CHANGELOG and git history are SoT for change history, ADR records design decision rationale, documents describe current state only, never include revision history sections"
    applicable_tasks:
      - Document writing and style compliance
      - Style guide enforcement and quality checking
      - Documentation structure planning
      - Reference link verification and maintenance
      - Document review and consistency validation
    keywords:
      - document style
      - tag usage
