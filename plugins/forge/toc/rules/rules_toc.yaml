    purpose: Defines how the consult skill is used for creating documents from scratch, covering brainstorming, discussion, draft creation, and new requirements documents. Specifies how decisions, agenda display, recording, and the final document output are handled in this use case.
    content_details:
      - Input is the conversation context, and the finished product is a document
